<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعة رقمية</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 21 · التمرين 1</span>
      <h1>ساعة رقمية</h1>
      <p class="goal">تحديث الصفحة كل ثانية باستخدام setInterval.</p>
    </header>

    <div class="card center">
      <div id="clock" class="clock">00:00:00</div>
      <p id="date" class="muted"></p>
      <div class="row center">
        <button id="formatBtn">تبديل 12 / 24 ساعة</button>
      </div>
    </div>
  </main>
</body>
</html>
