<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض قائمة مقالات من API</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 24 · التمرين 1</span>
      <h1>عرض قائمة مقالات من API</h1>
      <p class="goal">جلب مصفوفة بيانات وتحويلها إلى بطاقات في الصفحة.</p>
    </header>

    <div class="card">
      <div class="row">
        <select id="limitSelect" aria-label="عدد المقالات">
          <option value="3">3 مقالات</option>
          <option value="6" selected>6 مقالات</option>
          <option value="9">9 مقالات</option>
        </select>
        <button id="loadPostsBtn" class="btn-primary">تحميل المقالات</button>
      </div>
      <div id="loader" class="loader hidden"></div>
      <p id="status" class="msg"></p>
    </div>
    <div id="posts" class="grid"></div>
  </main>
</body>
</html>
