<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرسال نموذج: إنشاء مقال</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 25 · التمرين 1</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">إرسال نموذج: إنشاء مقال</h1>
      <p class="text-slate-500">إرسال بيانات نموذج إلى الخادم بطلب POST.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <form id="postForm">
        <label for="titleInput" class="block font-semibold mb-1">عنوان المقال</label>
        <input type="text" id="titleInput" placeholder="اكتب العنوان" required class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600">
        <label for="bodyInput" class="block font-semibold mt-3 mb-1">المحتوى</label>
        <textarea id="bodyInput" placeholder="اكتب المحتوى" required class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600 min-h-28"></textarea>
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <button type="submit" id="submitBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
      </form>
    </div>
    <div id="result" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <h2 class="text-lg font-bold mb-3">رد الخادم</h2>
      <pre id="responseOutput" dir="ltr" class="bg-slate-900 text-green-200 p-4 rounded-xl min-h-20 whitespace-pre-wrap font-mono text-sm text-left overflow-auto"></pre>
    </div>
  </main>
</body>
</html>
