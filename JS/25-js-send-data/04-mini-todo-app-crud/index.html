<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق مهام كامل مع API</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 25 · التمرين 4</span>
      <h1>تطبيق مهام كامل مع API</h1>
      <p class="goal">دمج GET و POST و PATCH و DELETE في تطبيق واحد.</p>
    </header>

    <div class="card">
      <div class="row">
        <input type="text" id="newTodo" placeholder="مهمة جديدة...">
        <button id="addBtn" class="btn-primary">إضافة</button>
      </div>
      <div id="loader" class="loader hidden"></div>
      <p id="stats" class="muted small"></p>
      <ul id="todoList" class="todo-list"></ul>
    </div>
  </main>
</body>
</html>
