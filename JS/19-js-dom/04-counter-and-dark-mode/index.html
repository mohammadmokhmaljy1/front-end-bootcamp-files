<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عدّاد ووضع داكن</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 19 · التمرين 4</span>
      <h1>عدّاد ووضع داكن</h1>
      <p class="goal">تغيير محتوى الصفحة وشكلها حسب الأحداث.</p>
    </header>

    <div class="card center">
      <h2 id="countValue" class="big-number">0</h2>
      <div class="row center">
        <button id="minusBtn">−</button>
        <button id="resetBtn" class="btn-ghost">إعادة</button>
        <button id="plusBtn" class="btn-primary">+</button>
      </div>
    </div>
    <div class="row center">
      <button id="themeBtn">الوضع الداكن</button>
    </div>
  </main>
</body>
</html>
