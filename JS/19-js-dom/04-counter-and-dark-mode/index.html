<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عدّاد ووضع داكن</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    /* يجعل الكلاس dark (على body) هو الذي يفعّل أنماط dark: */
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 19 · التمرين 4</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">عدّاد ووضع داكن</h1>
      <p class="text-slate-500">تغيير محتوى الصفحة وشكلها حسب الأحداث.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 text-center dark:bg-slate-800 dark:border-slate-700">
      <h2 id="countValue" class="text-6xl font-bold my-2">0</h2>
      <div class="flex justify-center gap-2 mt-3">
        <button id="minusBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed dark:bg-slate-700 dark:text-white">−</button>
        <button id="resetBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed dark:bg-slate-700 dark:text-white">إعادة</button>
        <button id="plusBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">+</button>
      </div>
    </div>
    <div class="flex justify-center">
      <button id="themeBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed dark:bg-slate-700 dark:text-white">الوضع الداكن</button>
    </div>
  </main>
</body>
</html>
