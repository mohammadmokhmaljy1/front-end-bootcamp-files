<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة مهام: إضافة وحذف</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 19 · التمرين 3</span>
      <h1>قائمة مهام: إضافة وحذف</h1>
      <p class="goal">إنشاء عناصر جديدة وحذفها من الصفحة.</p>
    </header>

    <div class="card">
      <div class="row">
        <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة...">
        <button id="addBtn" class="btn-primary">إضافة</button>
      </div>
      <ul id="taskList" class="todo-list"></ul>
      <p id="emptyMsg" class="muted">لا توجد مهام بعد، أضف أول مهمة!</p>
      <p id="counter" class="muted small">عدد المهام: 0</p>
    </div>
  </main>
</body>
</html>
