<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير النص والشكل</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 19 · التمرين 1</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">تغيير النص والشكل</h1>
      <p class="text-slate-500">تحديد عناصر الصفحة وتغيير نصها وتنسيقها.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <h2 id="title" class="text-xl font-bold">مرحباً بك في الدرس</h2>
      <p id="description" class="text-slate-500 mt-1">هذا نص تجريبي سنغيّره باستخدام JavaScript.</p>
      <div id="box" class="my-4 rounded-xl border-2 border-dashed border-slate-300 text-center p-6 transition-all duration-300">أنا صندوق قابل للتغيير</div>
      <div class="flex flex-wrap items-center gap-2 mt-3">
        <button id="changeTextBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">غيّر النص</button>
        <button id="changeStyleBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">غيّر الشكل</button>
        <button id="resetBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">إعادة</button>
      </div>
    </div>
  </main>
</body>
</html>
