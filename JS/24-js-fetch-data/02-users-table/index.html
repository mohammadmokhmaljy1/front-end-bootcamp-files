<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول المستخدمين من API</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 24 · التمرين 2</span>
      <h1>جدول المستخدمين من API</h1>
      <p class="goal">تعبئة جدول HTML من بيانات قادمة من الخادم.</p>
    </header>

    <div class="card">
      <div class="row">
        <button id="loadUsersBtn" class="btn-primary">تحميل المستخدمين</button>
        <span id="count" class="muted small"></span>
      </div>
      <table id="usersTable">
        <thead>
          <tr><th>#</th><th>الاسم</th><th>البريد</th><th>المدينة</th><th>الشركة</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
