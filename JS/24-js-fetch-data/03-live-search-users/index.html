<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بحث مباشر في المستخدمين</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 24 · التمرين 3</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">بحث مباشر في المستخدمين</h1>
      <p class="text-slate-500">جلب البيانات مرة واحدة ثم فلترتها أثناء الكتابة.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <input type="text" id="searchInput" placeholder="ابحث بالاسم أو البريد..." class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600">
      <p id="resultCount" class="text-slate-500 text-sm mt-2"></p>
      <ul id="usersList" class="mt-3 space-y-2"></ul>
      <p id="noResult" class="hidden mt-3 rounded-lg px-3 py-2 bg-blue-100 text-blue-800">لا توجد نتائج مطابقة.</p>
    </div>
  </main>
</body>
</html>
