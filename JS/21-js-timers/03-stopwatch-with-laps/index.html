<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعة إيقاف مع اللفّات</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 21 · التمرين 3</span>
      <h1>ساعة إيقاف مع اللفّات</h1>
      <p class="goal">قياس الوقت وتسجيل لفّات باستخدام setInterval.</p>
    </header>

    <div class="card center">
      <div id="display" class="clock">00:00.00</div>
      <div class="row center">
        <button id="startBtn" class="btn-primary">ابدأ</button>
        <button id="stopBtn">إيقاف</button>
        <button id="lapBtn">لفّة</button>
        <button id="resetBtn" class="btn-ghost">إعادة</button>
      </div>
      <ol id="laps"></ol>
    </div>
  </main>
</body>
</html>
