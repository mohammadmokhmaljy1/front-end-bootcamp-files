<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديد كل العناصر بالكلاس</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 22 · التمرين 1</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">تحديد كل العناصر بالكلاس</h1>
      <p class="text-slate-500">التعامل مع مجموعة عناصر دفعة واحدة.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <h2 class="text-lg font-bold mb-3">قائمة العناصر</h2>
      <ul class="list-disc ps-6 space-y-1">
        <li class="item rounded px-2">العنصر الأول</li>
        <li class="item rounded px-2">العنصر الثاني</li>
        <li class="item rounded px-2">العنصر الثالث</li>
        <li class="item rounded px-2">العنصر الرابع</li>
        <li class="item rounded px-2">العنصر الخامس</li>
      </ul>
      <p class="note mt-4">ملاحظة 1: هذه فقرة من الكلاس note.</p>
      <p class="note">ملاحظة 2: وهذه فقرة أخرى من نفس الكلاس.</p>
      <div class="flex flex-wrap items-center gap-2 mt-3">
        <button id="highlightBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">ميّز الكل</button>
        <button id="clearBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">إزالة التمييز</button>
        <button id="countBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">عدّ العناصر</button>
      </div>
      <p id="countResult" class="empty:hidden mt-3 rounded-lg px-3 py-2 bg-blue-100 text-blue-800"></p>
    </div>
  </main>
</body>
</html>
