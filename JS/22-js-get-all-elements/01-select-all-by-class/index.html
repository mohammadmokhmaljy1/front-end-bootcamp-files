<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحديد كل العناصر بالكلاس</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 22 · التمرين 1</span>
      <h1>تحديد كل العناصر بالكلاس</h1>
      <p class="goal">التعامل مع مجموعة عناصر دفعة واحدة.</p>
    </header>

    <div class="card">
      <h2>قائمة العناصر</h2>
      <ul class="item-list">
        <li class="item">العنصر الأول</li>
        <li class="item">العنصر الثاني</li>
        <li class="item">العنصر الثالث</li>
        <li class="item">العنصر الرابع</li>
        <li class="item">العنصر الخامس</li>
      </ul>
      <p class="note">ملاحظة 1: هذه فقرة من الكلاس note.</p>
      <p class="note">ملاحظة 2: وهذه فقرة أخرى من نفس الكلاس.</p>
      <div class="row">
        <button id="highlightBtn" class="btn-primary">ميّز الكل</button>
        <button id="clearBtn">إزالة التمييز</button>
        <button id="countBtn">عدّ العناصر</button>
      </div>
      <p id="countResult" class="msg info"></p>
    </div>
  </main>
</body>
</html>
