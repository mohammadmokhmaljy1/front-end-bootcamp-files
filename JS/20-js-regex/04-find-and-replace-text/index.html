<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث والاستبدال في النصوص</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 20 · التمرين 4</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">البحث والاستبدال في النصوص</h1>
      <p class="text-slate-500">استخراج أجزاء من نص واستبدالها باستخدام match و replace.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <label for="sourceText" class="block font-semibold mt-3 mb-1">النص</label>
      <textarea id="sourceText" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600 min-h-28">تواصل معنا على info@devmmnd.com أو sales@example.org
رقم الطلب 4521 وقيمته 150 دولاراً
نبدأ المعسكر قريباً #frontend #devmmnd #javascript</textarea>
      <div class="flex flex-wrap items-center gap-2 mt-3">
        <button id="findHashtagsBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">استخراج الوسوم</button>
        <button id="findNumbersBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">استخراج الأرقام</button>
        <button id="findEmailsBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">استخراج الإيميلات</button>
        <button id="maskDigitsBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition cursor-pointer">إخفاء الأرقام</button>
      </div>
      <ul id="results" class="mt-4 space-y-2"></ul>
    </div>
  </main>
</body>
</html>
