<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قائمة مهام: إضافة وحذف</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 19 · التمرين 3</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">قائمة مهام: إضافة وحذف</h1>
      <p class="text-slate-500">إنشاء عناصر جديدة وحذفها من الصفحة.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <div class="flex flex-wrap items-center gap-2">
        <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." class="flex-1 min-w-40 px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600">
        <button id="addBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">إضافة</button>
      </div>
      <ul id="taskList" class="mt-4 space-y-2"></ul>
      <p id="emptyMsg" class="text-slate-500 mt-4">لا توجد مهام بعد، أضف أول مهمة!</p>
      <p id="counter" class="text-slate-500 text-sm mt-2">عدد المهام: 0</p>
    </div>
  </main>
</body>
</html>
