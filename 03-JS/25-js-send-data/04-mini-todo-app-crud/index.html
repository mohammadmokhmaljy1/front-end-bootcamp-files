<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق مهام كامل مع API</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 25 · التمرين 4</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">تطبيق مهام كامل مع API</h1>
      <p class="text-slate-500">دمج GET و POST و PATCH و DELETE في تطبيق واحد.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <div class="flex flex-wrap items-center gap-2">
        <input type="text" id="newTodo" placeholder="مهمة جديدة..." class="flex-1 min-w-40 px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600">
        <button id="addBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">إضافة</button>
      </div>
      <div id="loader" class="hidden animate-spin rounded-full size-7 border-4 border-slate-200 border-t-blue-600 mx-auto my-3"></div>
      <p id="stats" class="text-slate-500 text-sm mt-3"></p>
      <ul id="todoList" class="mt-3 space-y-2"></ul>
    </div>
  </main>
</body>
</html>
