<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من رقم الهاتف السوري</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 20 · التمرين 2</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">التحقق من رقم الهاتف السوري</h1>
      <p class="text-slate-500">التحقق من أكثر من صيغة لرقم الهاتف.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <label for="phoneInput" class="block font-semibold mt-3 mb-1">رقم الهاتف</label>
      <input type="tel" id="phoneInput" placeholder="0933 123 456" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:outline-2 focus:outline-blue-600">
      <p class="text-slate-500 text-sm mt-2">أمثلة صحيحة: <code dir="ltr" class="bg-slate-100 px-1.5 rounded">0933123456</code> — <code dir="ltr" class="bg-slate-100 px-1.5 rounded">+963933123456</code> — <code dir="ltr" class="bg-slate-100 px-1.5 rounded">00963933123456</code></p>
      <div class="flex flex-wrap items-center gap-2 mt-3">
        <button id="checkBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">تحقق</button>
      </div>
      <p id="message" class="empty:hidden mt-3 rounded-lg px-3 py-2"></p>
    </div>
  </main>
</body>
</html>
