<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ساعة رقمية</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 21 · التمرين 1</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">ساعة رقمية</h1>
      <p class="text-slate-500">تحديث الصفحة كل ثانية باستخدام setInterval.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4 text-center">
      <div id="clock" dir="ltr" class="font-mono text-6xl font-bold tracking-wider">00:00:00</div>
      <p id="date" class="text-slate-500 mt-2"></p>
      <div class="flex justify-center gap-2 mt-4">
        <button id="formatBtn" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:border-blue-600 hover:text-blue-600 transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">تبديل 12 / 24 ساعة</button>
      </div>
    </div>
  </main>
</body>
</html>
