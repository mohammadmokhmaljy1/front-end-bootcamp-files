<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فلترة المعرض حسب التصنيف</title>
  <!-- Tailwind عبر CDN: مناسب للتعلّم والتجربة فقط -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <header class="mb-5">
      <span class="inline-block bg-blue-600 text-white text-xs px-3 py-0.5 rounded-full">الدرس 22 · التمرين 3</span>
      <h1 class="text-2xl font-bold mt-2 mb-1">فلترة المعرض حسب التصنيف</h1>
      <p class="text-slate-500">إظهار وإخفاء مجموعة عناصر حسب خاصية data-category.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-4">
      <div class="flex flex-wrap gap-2">
        <button class="filter-btn px-4 py-2 rounded-lg border border-slate-300 cursor-pointer transition bg-blue-600 text-white" data-filter="all">الكل</button>
        <button class="filter-btn px-4 py-2 rounded-lg border border-slate-300 cursor-pointer transition" data-filter="nature">طبيعة</button>
        <button class="filter-btn px-4 py-2 rounded-lg border border-slate-300 cursor-pointer transition" data-filter="city">مدن</button>
        <button class="filter-btn px-4 py-2 rounded-lg border border-slate-300 cursor-pointer transition" data-filter="food">طعام</button>
      </div>
      <p id="visibleCount" class="text-slate-500 text-sm mt-3">عدد الصور الظاهرة: 9</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3">
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-emerald-600" data-category="nature">غابة</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-blue-600" data-category="city">برج</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-orange-500" data-category="food">بيتزا</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-emerald-600" data-category="nature">جبل</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-blue-600" data-category="city">جسر</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-orange-500" data-category="food">فاكهة</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-emerald-600" data-category="nature">بحيرة</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-blue-600" data-category="city">شارع</div>
        <div class="photo block h-28 rounded-xl p-3 text-white font-bold bg-orange-500" data-category="food">حلويات</div>
      </div>
    </div>
  </main>
</body>
</html>
