<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث والاستبدال في النصوص</title>
  <link rel="stylesheet" href="../../shared/exercise.css">
  <!-- defer: يجعل المتصفح ينفّذ السكربت بعد تحميل عناصر الصفحة بالكامل -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <span class="badge">الدرس 20 · التمرين 4</span>
      <h1>البحث والاستبدال في النصوص</h1>
      <p class="goal">استخراج أجزاء من نص واستبدالها باستخدام match و replace.</p>
    </header>

    <div class="card">
      <label for="sourceText">النص</label>
      <textarea id="sourceText">تواصل معنا على info@devmmnd.com أو sales@example.org
رقم الطلب 4521 وقيمته 150 دولاراً
نبدأ المعسكر قريباً #frontend #devmmnd #javascript</textarea>
      <div class="row">
        <button id="findHashtagsBtn">استخراج الوسوم</button>
        <button id="findNumbersBtn">استخراج الأرقام</button>
        <button id="findEmailsBtn">استخراج الإيميلات</button>
        <button id="maskDigitsBtn" class="btn-danger">إخفاء الأرقام</button>
      </div>
      <ul id="results" class="plain-list"></ul>
    </div>
  </main>
</body>
</html>
